name: eye_speak
description: تطبيق التواصل بالعين للأشخاص ذوي الإعاقة الحركية الكاملة
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # كاميرا وتتبع العين
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.9.0
  
  # الصوت والنطق
  flutter_tts: ^4.0.2
  audioplayers: ^6.0.0
  
  # الإشعارات والطوارئ
  flutter_local_notifications: ^17.2.2
  url_launcher: ^6.3.0
  telephony: ^0.2.0
  
  # الحالة والتخزين
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  
  # الذكاء الاصطناعي للاقتراحات
  http: ^1.2.2
  
  # UI
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  vibration: ^1.9.0
  wakelock_plus: ^1.2.8
  
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/sounds/
    
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
